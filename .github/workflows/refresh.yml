# Nightly refresh of the official records (Cleveland City Council's public Legistar record, the city's
# ward maps, and ordinance texts), then a rebuild. Vercel redeploys when the commit lands.
# Official records only: news items need a person's approval and never enter through this job.
# If the new data looks broken, scripts/refresh.py keeps the old files and the job fails, so nothing
# is published and GitHub emails the repository owner.
name: Nightly records refresh

on:
  schedule:
    - cron: "17 10 * * *"   # 6:17 a.m. Eastern in daylight time, 5:17 a.m. in standard time
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: records-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Tools that read ordinance documents (PDF and .doc)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer-nogui

      - name: Python and Node packages
        run: |
          pip install "shapely>=2,<3" "pillow>=10"
          npm ci

      - name: Pull the official records and log what changed
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python scripts/refresh.py

      - name: Bench, build packets and apply signed approvals
        env:
          BENCH_APPROVAL_KEY: ${{ secrets.BENCH_APPROVAL_KEY }}
        run: |
          python scripts/packets.py
          python scripts/commit.py

      - name: Build the app
        run: python build.py

      - name: Check the built site (if this fails nothing is published and the live site stays as it was)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CI: "true"
        run: node scripts/checks/run.js

      - name: Flag summaries whose source changed
        if: hashFiles('dist/review-needed.json') != ''
        run: |
          echo "### Summaries to re-check" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/review-needed.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish (commit data and site; Vercel deploys the commit)
        run: |
          git config user.name "civic-graph-refresh"
          git config user.email "civic-graph-refresh@users.noreply.github.com"
          git add data site bench
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Nightly records refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Tell the team when the refresh fails (an issue, so everyone watching the repository is notified)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly records refresh failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again on $(date -u +%Y-%m-%d). Run: $url"
          else
            gh issue create --title "$title" --body "The nightly refresh failed on $(date -u +%Y-%m-%d). Nothing was published, so the live site still shows the last good data and its own Updated time. Open the run to see which step failed: $url"
          fi
